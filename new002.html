<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MACRO SONIC | Laboratorio de Sonido</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0b10;
            --bg-card: #141620;
            --accent-sonic: #00f2ff;
            --accent-glow: #7000ff;
            --text-main: #b0b4c8;
            --cremita: #f2e9d9;
            --cremita-muted: #d9ceb8;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Navbar personalizada */
        .navbar {
            background-color: rgba(10, 11, 16, 0.95);
            border-bottom: 1px solid #2a2d3e;
            padding: 1rem 2rem;
        }

        .navbar-brand {
            font-family: 'Share Tech Mono', monospace;
            color: var(--accent-sonic) !important;
            font-weight: 800;
            letter-spacing: 2px;
            font-size: 1.5rem;
        }

        /* Hero Section */
        .hero-section {
            padding: 100px 0 60px;
            background: linear-gradient(180deg, #0a0b10 0%, #141620 100%);
            text-align: center;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--cremita);
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: var(--accent-sonic);
            font-family: 'Share Tech Mono', monospace;
        }

        /* Sección de Carga (Upload) */
        .upload-container {
            background-color: var(--bg-card);
            border: 2px dashed #3a3f58;
            border-radius: 20px;
            padding: 40px;
            margin-top: -50px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transition: border-color 0.3s;
        }

        .upload-container:hover {
            border-color: var(--accent-sonic);
        }

        .form-label {
            color: var(--cremita-muted);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .form-control {
            background-color: #0a0b10;
            border: 1px solid #3a3f58;
            color: var(--cremita);
            border-radius: 10px;
            padding: 12px;
        }

        .form-control:focus {
            background-color: #0d0f1a;
            border-color: var(--accent-sonic);
            color: var(--cremita);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
        }

        .btn-sonic {
            background-color: var(--accent-sonic);
            color: #0a0b10;
            font-weight: 800;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            text-transform: uppercase;
            transition: all 0.3s;
            width: 100%;
            margin-top: 20px;
        }

        .btn-sonic:hover {
            background-color: #00d8e6;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 242, 255, 0.4);
        }

        /* Footer */
        footer {
            padding: 40px 0;
            text-align: center;
            font-size: 0.9rem;
            color: #5a5f7d;
            border-top: 1px solid #2a2d3e;
            margin-top: 60px;
        }

        .sonic-wave {
            height: 4px;
            background: linear-gradient(90deg, var(--accent-glow), var(--accent-sonic), var(--accent-glow));
            width: 100%;
            position: fixed;
            bottom: 0;
        }

        /* Estudiantes de sonido: Visualizador Ficticio */
        .visualizer-mock {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 40px;
            margin: 20px 0;
        }

        .bar {
            width: 4px;
            background-color: var(--accent-sonic);
            border-radius: 2px;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { height: 5px; }
            to { height: 30px; }
        }
    </style>
</head>
<body>

    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">MACRO SONIC</a>
            <div class="ms-auto">
                <span class="badge rounded-pill bg-dark border border-secondary text-info">STUDIO MODE</span>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <header class="hero-section">
        <div class="container">
            <div class="visualizer-mock">
                <div class="bar" style="animation-delay: 0.1s"></div>
                <div class="bar" style="animation-delay: 0.3s"></div>
                <div class="bar" style="animation-delay: 0.2s"></div>
                <div class="bar" style="animation-delay: 0.5s"></div>
                <div class="bar" style="animation-delay: 0.4s"></div>
            </div>
            <h1 class="hero-title">Encuentra tu Sonido</h1>
            <p class="hero-subtitle">MANDANOS TU DEMO • MEZCLA • MASTERIZACIÓN</p>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="upload-container">
                    <h3 class="text-center mb-4" style="color: var(--cremita);">PORTAL DE CARGA</h3>

                    <form>
                        <!-- Nombre del Artista -->
                        <div class="mb-3">
                            <label class="form-label">ARTISTA O BANDA</label>
                            <input type="text" class="form-control" placeholder="Ej: Los Resonantes">
                        </div>

                        <!-- Título del Demo -->
                        <div class="mb-3">
                            <label class="form-label">TÍTULO DEL TRACK</label>
                            <input type="text" class="form-control" placeholder="Ej: Mañana (Versión 1)">
                        </div>

                        <!-- Selección de Archivo -->
                        <div class="mb-3">
                            <label class="form-label">SUBIR ARCHIVO (.WAV O .MP3)</label>
                            <input type="file" class="form-control">
                            <div class="form-text mt-2" style="color: #6c757d; font-size: 0.8rem;">
                                * Preferiblemente WAV 44.1kHz / 24-bit para mejores resultados.
                            </div>
                        </div>

                        <!-- Notas Técnicas -->
                        <div class="mb-3">
                            <label class="form-label">NOTAS DE PRODUCCIÓN</label>
                            <textarea class="form-control" rows="3" placeholder="Cuéntanos qué buscas en el sonido..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-sonic">ENVIAR A REVISIÓN</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>© 2026 MACRO SONIC LABS - Ingeniería de Sonido Aplicada</p>
            <p class="small">Ubicación Ficticia: Sector Norte, Estudio de Altura</p>
        </div>
    </footer>

    <div class="sonic-wave"></div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
